<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Segaloka · Travel Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
  >

  <!--
    V7 visual parity source.
    Business/runtime modules remain reference-only.
  -->
  <link rel="stylesheet" href="./runtime/styles.css">
  <link rel="stylesheet" href="./travel.css">
  <link rel="stylesheet" href="/shared/v7-presentational.css">
</head>

<body data-segaloka-app="travel">

  <div id="travel-app" class="app travel-app">

    <aside
      id="travel-sidebar"
      class="side travel-sidebar"
      aria-label="Navigasi Travel"
    >
      <div class="travel-brand">
        <div class="travel-brand-mark" aria-hidden="true">S</div>

        <div class="travel-brand-copy">
          <strong>Segaloka</strong>
          <span>Travel Dashboard</span>
        </div>

        <button
          id="travel-sidebar-close"
          class="travel-icon-button travel-mobile-only"
          type="button"
          aria-label="Tutup navigasi"
        >
          ×
        </button>
      </div>

      <div class="travel-tenant">
        <div class="travel-tenant-icon" aria-hidden="true">T</div>

        <div>
          <strong>Travel</strong>
          <span>Dashboard</span>
        </div>
      </div>

      <nav
        id="travel-navigation"
        class="travel-navigation"
        aria-label="Menu Travel"
      ></nav>

      <div class="travel-sidebar-footer">
        <div class="travel-boundary-label">
          Dashboard Travel
        </div>

        <div class="travel-boundary-status">
          Independent boundary
        </div>
      </div>
    </aside>

    <div
      id="travel-sidebar-overlay"
      class="travel-sidebar-overlay"
      hidden
    ></div>

    <div class="main travel-main">

      <header class="top travel-topbar">

        <div class="travel-topbar-start">
          <button
            id="travel-sidebar-open"
            class="travel-icon-button travel-mobile-only"
            type="button"
            aria-label="Buka navigasi"
          >
            ☰
          </button>

          <div>
            <div class="travel-topbar-eyebrow">
              SEGALOKA
            </div>

            <div
              id="travel-page-title"
              class="travel-page-title"
            >
              Beranda
            </div>
          </div>
        </div>

        <div class="travel-topbar-end">

          <div
            class="travel-runtime-indicator"
            title="Runtime Travel masih dalam tahap ekstraksi"
          >
            <span
              class="travel-runtime-dot"
              aria-hidden="true"
            ></span>

            <span>Travel</span>
          </div>

          <button
            id="travel-account-button"
            class="travel-account"
            type="button"
            disabled
            aria-label="Akun Travel belum diaktifkan"
          >
            <span
              class="travel-account-avatar"
              aria-hidden="true"
            >
              T
            </span>

            <span class="travel-account-copy">
              <strong>Travel</strong>
              <small>Auth belum diaktifkan</small>
            </span>
          </button>

        </div>
      </header>

      <main
        id="travel-content"
        class="work travel-content"
        tabindex="-1"
      ></main>

    </div>
  </div>

  <!-- Contracts are executable metadata only. -->
  <script src="./contracts/app.contract.js"></script>
  <script src="./contracts/auth.contract.js"></script>
  <script src="./contracts/data.contract.js"></script>
  <script src="./contracts/services.contract.js"></script>
  <script src="./contracts/navigation.contract.js"></script>

  <!--
    IMPORTANT:
    runtime/core.js
    runtime/data.js
    runtime/portals.js
    runtime/gateway.js
    runtime/notify.js
    runtime/sync.js
    and other V7 runtime modules are NOT loaded here.
  -->
  <script src="./ui/travel-ui.js"></script>
<script src="./renderers/travel-renderers.js"></script>
  <script src="./runtime/dashboard-session.js"></script>
  <script src="./runtime/departures-api.js"></script>
<script src="./travel-bootstrap.js"></script>
  </body>
  </html>
