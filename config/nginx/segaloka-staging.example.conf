# Template only. Do not activate before DNS, TLS, firewall, and deployment approval.
#
# Satu hostname = satu dashboard = satu entry port. Setiap entry server
# menyajikan login di "/" dan meneruskan "/bff/*" ke BFF dashboard itu sendiri,
# sehingga login, sesi (cookie Path=/bff), dan dashboard berada di origin yang
# sama. Jalankan setiap entry dengan SEGALOKA_PUBLIC_ORIGIN=https://<hostname>
# (Travel: FRONTEND_ORIGIN untuk BFF Travel) agar Origin HTTPS diterima.
#
# Port entry (tidak diubah):
#   Control Center 4202, Travel 4200, Vendor 4204, Affiliate 4212,
#   Agen 4216, Mitra 4214, Traveler 4210. API 4192.
upstream segaloka_api_staging { server 127.0.0.1:4192; }
upstream segaloka_control_staging { server 127.0.0.1:4202; }
upstream segaloka_travel_staging { server 127.0.0.1:4200; }
upstream segaloka_vendor_staging { server 127.0.0.1:4204; }
upstream segaloka_affiliate_staging { server 127.0.0.1:4212; }
upstream segaloka_agen_staging { server 127.0.0.1:4216; }
upstream segaloka_mitra_staging { server 127.0.0.1:4214; }
upstream segaloka_traveler_staging { server 127.0.0.1:4210; }

